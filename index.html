document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

roH1Style }}\">El departamento de cobros <span style=\"color:#5B8DEF\">que su negocio no tiene.<\u002Fspan><\u002Fh1>\n        <p data-rid=\"heroLead\" style=\"{{ heroLeadStyle }}\">Cobramos por usted —o bajo su propia marca— con gestión persuasiva y respaldo legal. Usted no vuelve a perseguir a un deudor.<\u002Fp>\n        <div data-rid=\"heroCta\" style=\"{{ heroCtaRowStyle }}\">\n          <a href=\"{{ waHref }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-block;text-decoration:none;font-weight:700;border-radius:12px;background:#fff;color:#12388A;padding:15px 30px;font-size:15px;box-shadow:0 16px 40px rgba(4,18,54,.3);transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s\" style-hover=\"{{ btnWhiteHoverStyle }}\">Hablar por WhatsApp<\u002Fa>\n          <a href=\"#plataforma\" style=\"color:#fff;font-size:14.5px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px;opacity:.92\">Ver la plataforma <span ref=\"{{ heroArrowRef }}\" style=\"transition:transform .26s\">→<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n        <div data-rid=\"heroCred\" style=\"{{ heroCredStyle }}\">\n          <span>Experiencia en cobranzas para la banca dominicana<\u002Fspan><span style=\"width:4px;height:4px;border-radius:50%;background:#5B8DEF\"><\u002Fspan>\n          <span>Respaldo legal · Ley 85-25<\u002Fspan><span style=\"width:4px;height:4px;border-radius:50%;background:#5B8DEF\"><\u002Fspan>\n          <span>Gestión documentada<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rid=\"statement\" style=\"{{ statementWrapStyle }}\">\n        <div ref=\"{{ statementRef }}\" style=\"position:relative;background:#fff;border-radius:20px;padding:26px;color:#0A1830;box-shadow:0 44px 90px rgba(4,18,54,.34),0 0 0 1px rgba(91,141,239,.25);max-width:400px;margin-left:auto\">\n          <div style=\"position:absolute;top:0;left:0;right:0;height:2px;overflow:hidden\">\n            <div style=\"width:40%;height:100%;background:linear-gradient(90deg,transparent,#2563EB,transparent);animation:sc-scan 3.4s linear infinite\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;top:-22px;left:-18px;background:#fff;border:1px solid #E1E9F5;border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:600;color:#243A5E;box-shadow:0 16px 36px rgba(4,18,54,.16);display:flex;align-items:center;gap:8px\">\n            <span style=\"width:8px;height:8px;border-radius:50%;background:#16A46B;animation:sc-tickpulse 1.8s ease-in-out infinite\"><\u002Fspan>Comprobante recibido\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;margin-top:6px\">\n            <div><div style=\"font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A9BB8\">Estado de cuenta<\u002Fdiv><div style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;margin-top:4px\">Apto. 4B · Torre Marbella<\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:11.5px;font-weight:700;color:#12388A;background:#E9F0FF;border-radius:100px;padding:5px 11px\">Gestión activa<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:34px;letter-spacing:-.03em;margin-bottom:4px\">RD$35,000 <span style=\"font-size:15px;color:#586A87;font-family:'Inter',sans-serif;font-weight:500\">/mes<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#586A87;margin-bottom:18px\">Vence el día 5 de cada mes<\u002Fdiv>\n          <div style=\"display:flex;justify-content:center;margin-bottom:10px\">\n            <svg width=\"140\" height=\"80\" sc-camel-view-box=\"0 0 140 80\">\n              <path d=\"M10 70 A60 60 0 0 1 130 70\" fill=\"none\" stroke=\"#E1E9F5\" stroke-width=\"8\" stroke-linecap=\"round\"><\u002Fpath>\n              <path d=\"M10 70 A60 60 0 0 1 130 70\" fill=\"none\" stroke=\"#2563EB\" stroke-width=\"8\" stroke-linecap=\"round\" style=\"stroke-dasharray:188;stroke-dashoffset:{{ radarOffset }};transition:stroke-dashoffset 1.4s cubic-bezier(.22,.61,.36,1)\"><\u002Fpath>\n              <text x=\"70\" y=\"58\" text-anchor=\"middle\" font-family=\"Manrope,sans-serif\" font-weight=\"800\" font-size=\"20\" fill=\"#0A1830\">3/6<\u002Ftext>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#586A87;text-align:center;margin-bottom:18px\">Nivel <b style=\"color:#0A1830\">3 de 6<\u002Fb> · gestión telefónica<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;padding-top:16px;border-top:1px solid #E1E9F5;font-size:13.5px;color:#243A5E;font-weight:500\">\n            <span style=\"width:20px;height:20px;border-radius:50%;background:rgba(22,164,107,.12);display:grid;place-items:center;flex:0 0 auto\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12l5 5 9-11\" stroke=\"#16A46B\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            Pago confirmado por el propietario\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"position:relative;overflow:hidden;background:#0A1830;color:#fff\">\n  <canvas ref=\"{{ metricsCanvasRef }}\" style=\"position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.6\"><\u002Fcanvas>\n  <div ref=\"{{ metricsRef }}\" style=\"max-width:1180px;margin:0 auto;position:relative;z-index:2;display:grid;grid-template-columns:{{ metricsCols }}\">\n    <div style=\"padding:40px 28px;border-right:1px solid rgba(255,255,255,.09)\">\n      <div style=\"font-family:'Manrope',sans-serif;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1\">{{ metricVals.exp }}<\u002Fdiv>\n      <div style=\"font-size:13px;color:#9FB0CE;margin-top:9px;max-width:22ch\">años de experiencia en cobro persuasivo<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:40px 28px;border-right:1px solid rgba(255,255,255,.09)\">\n      <div style=\"font-family:'Manrope',sans-serif;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1\">{{ metricVals.levels }}<\u002Fdiv>\n      <div style=\"font-size:13px;color:#9FB0CE;margin-top:9px;max-width:22ch\">niveles de gestión, de la cortesía a la vía legal<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:40px 28px;border-right:1px solid rgba(255,255,255,.09)\">\n      <div style=\"font-family:'Manrope',sans-serif;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1\">{{ metricVals.motor }}<\u002Fdiv>\n      <div style=\"font-size:13px;color:#9FB0CE;margin-top:9px;max-width:22ch\">motor de cobro, múltiples carteras<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:40px 28px;display:flex;flex-direction:column;justify-content:center\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5B8DEF;margin-bottom:12px\">Capacidad<\u002Fdiv>\n      <svg width=\"130\" height=\"42\" sc-camel-view-box=\"0 0 130 42\" fill=\"none\" aria-hidden=\"true\">\n        <path d=\"M2 38 L26 33 L50 30 L74 20 L98 13 L128 3\" stroke=\"#5B8DEF\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"stroke-dasharray:220;stroke-dashoffset:{{ sparkOffset }};transition:stroke-dashoffset 1.6s cubic-bezier(.22,.61,.36,1) .2s\"><\u002Fpath>\n        <path d=\"M2 38 L26 33 L50 30 L74 20 L98 13 L128 3 L128 42 L2 42 Z\" fill=\"url(#sg)\" opacity=\".28\"><\u002Fpath>\n        <defs><linearGradient id=\"sg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#5B8DEF\"><\u002Fstop><stop offset=\"1\" stop-color=\"#5B8DEF\" stop-opacity=\"0\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n      <\u002Fsvg>\n      <div style=\"font-size:13px;color:#9FB0CE;margin-top:8px\">escala sin sumar costo por puerta<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"plataforma\" style=\"position:relative;overflow:hidden;padding:{{ secPad }};background:#0E2350;color:#EAF0FB\">\n  <canvas ref=\"{{ platformCanvasRef }}\" style=\"position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5\"><\u002Fcanvas>\n  <div style=\"position:absolute;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(43,99,235,.3),transparent 62%);filter:blur(30px);top:-180px;right:-140px;pointer-events:none\"><\u002Fdiv>\n  <div style=\"max-width:1180px;margin:0 auto;padding:0 {{ wrapPad }};position:relative;z-index:2\">\n    <div data-rid=\"platformHead\" style=\"{{ platformHeadStyle }};max-width:62ch\">\n      <span style=\"font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#5B8DEF\">La plataforma<\u002Fspan>\n      <h2 style=\"font-family:'Manrope',sans-serif;color:#fff;font-size:clamp(30px,4.2vw,46px);line-height:1.05;margin:16px 0 0;font-weight:800;letter-spacing:-.04em\">Un motor. Muchas carteras.<\u002Fh2>\n      <p style=\"font-size:17px;color:#A6B5D2;margin:18px 0 0\">Somos el departamento de cobros externo que su negocio no tiene. Empezamos con la renta, y el mismo servicio atiende otras carteras — de forma tercerizada o bajo su propia marca.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:{{ pfCols }};gap:44px;align-items:center;margin-top:56px;position:relative\">\n      <div data-rid=\"engine\" style=\"{{ engineStyle }};position:relative;background:linear-gradient(160deg,#12388A,#0C2E6E);border:1px solid rgba(143,180,255,.28);border-radius:20px;padding:30px;box-shadow:0 30px 70px rgba(4,18,54,.4)\">\n        <div style=\"position:absolute;inset:-1px;border-radius:20px;pointer-events:none;border:1px solid rgba(143,180,255,.5);animation:sc-pulsering 3.2s ease-in-out infinite\"><\u002Fdiv>\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#5B8DEF\">El motor<\u002Fdiv>\n        <h3 style=\"font-family:'Manrope',sans-serif;color:#fff;font-size:24px;margin:8px 0 18px;letter-spacing:-.02em\">StandardCheck Core<\u002Fh3>\n        <ul style=\"list-style:none;margin:0;padding:0;display:grid;gap:12px\">\n          <sc-for list=\"{{ engineFeatures }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <li style=\"display:flex;align-items:center;gap:12px;font-size:14.5px;color:#CDD9EF\"><span style=\"width:7px;height:7px;border-radius:50%;background:#5B8DEF;flex:0 0 auto\"><\u002Fspan>{{ f }}<\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div data-rid=\"verticals\" style=\"{{ verticalsStyle }};display:grid;grid-template-columns:{{ verticalsCols }};gap:12px\">\n        <sc-for list=\"{{ verticals }}\" as=\"v\" hint-placeholder-count=\"6\">\n          <div style=\"background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:18px;transition:background .3s,transform .3s cubic-bezier(.34,1.56,.64,1),border-color .3s\" style-hover=\"{background:'rgba(255,255,255,.08)',transform:'translateY(-3px)',borderColor:'rgba(143,180,255,.5)'}\">\n            <div style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;color:#fff\">{{ v.name }}<\u002Fdiv>\n            <span style=\"font-size:11.5px;font-weight:700;margin-top:8px;display:inline-block;padding:3px 10px;border-radius:100px;background:{{ v.badgeBg }};color:{{ v.badgeColor }};border:{{ v.badgeBorder }}\">{{ v.status }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-rid=\"modes\" style=\"{{ modesStyle }};display:grid;grid-template-columns:{{ modesCols }};gap:16px;margin-top:30px\">\n      <div style=\"background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px\">\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:17px;color:#fff;margin-bottom:8px\"><span style=\"display:inline-block;width:8px;height:8px;border-radius:50%;background:#5B8DEF;margin-right:9px;vertical-align:middle\"><\u002Fspan>Tercerizado<\u002Fdiv>\n        <p style=\"font-size:14px;color:#A6B5D2;margin:0\">Usted nos contrata y cobramos por usted. Su departamento de cobros, sin nómina ni fricción.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px\">\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:17px;color:#fff;margin-bottom:8px\"><span style=\"display:inline-block;width:8px;height:8px;border-radius:50%;background:#5B8DEF;margin-right:9px;vertical-align:middle\"><\u002Fspan>Marca blanca<\u002Fdiv>\n        <p style=\"font-size:14px;color:#A6B5D2;margin:0\">Ofrezca el cobro bajo su propia marca. Somos el motor invisible; sus clientes ven su nombre, no el nuestro.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"servicio\" style=\"padding:{{ secPad }};background:#F5F8FD\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:0 {{ wrapPad }};display:grid;grid-template-columns:{{ svcCols }};gap:60px;align-items:start\">\n    <div data-rid=\"svcIntro\" style=\"{{ svcIntroStyle }};position:{{ svcIntroPos }};top:112px\">\n      <span style=\"font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#12388A\">El servicio<\u002Fspan>\n      <h2 style=\"font-family:'Manrope',sans-serif;font-size:clamp(28px,3.6vw,40px);line-height:1.08;margin:15px 0 0;font-weight:800;letter-spacing:-.035em\">Nos encargamos del cobro. Usted conserva la relación.<\u002Fh2>\n      <p style=\"font-size:16px;color:#586A87;margin:18px 0 0\">Somos un equipo con experiencia en cobranzas, forjada gestionando carteras para la mayoría de los bancos y aseguradoras del país. Contactamos a su inquilino y lo llevamos a pagar; usted mantiene el trato, nosotros hacemos la gestión que a nadie le gusta hacer.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column\">\n      <sc-for list=\"{{ svcItems }}\" as=\"it\" hint-placeholder-count=\"4\">\n        <div style=\"padding:28px 0;border-top:1px solid #E1E9F5;display:grid;grid-template-columns:14px 1fr;gap:18px\" data-first=\"{{ $index }}\">\n          <span style=\"width:8px;height:8px;border-radius:50%;background:#2563EB;margin-top:9px\"><\u002Fspan>\n          <div><h3 style=\"font-size:19px;font-weight:700;margin:0 0 5px;letter-spacing:-.02em;font-family:'Manrope',sans-serif\">{{ it.title }}<\u002Fh3><p style=\"font-size:15px;color:#586A87;margin:0;max-width:50ch\">{{ it.desc }}<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"proceso\" style=\"padding:{{ secPad }};background:#EEF3FE;border-top:1px solid #E1E9F5;border-bottom:1px solid #E1E9F5\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:0 {{ wrapPad }}\">\n    <div data-rid=\"procHead\" style=\"{{ procHeadStyle }};max-width:62ch\">\n      <span style=\"font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#12388A\">El proceso<\u002Fspan>\n      <h2 style=\"font-family:'Manrope',sans-serif;font-size:clamp(30px,4.2vw,46px);line-height:1.05;margin:16px 0 0;font-weight:800;letter-spacing:-.04em\">Seis niveles de persuasión que escalan.<\u002Fh2>\n      <p style=\"font-size:17px;color:#586A87;margin:18px 0 0\">La mayoría de las cuentas se resuelven persuadiendo, no litigando. El tono sube solo cuando la cuenta lo exige: los niveles 1 a 4 son gestión persuasiva incluida; los niveles 5 y 6, el respaldo legal para el caso que no cede.<\u002Fp>\n    <\u002Fdiv>\n    <div ref=\"{{ spineRef }}\" style=\"margin-top:54px;position:relative;padding-left:26px\">\n      <div style=\"position:absolute;left:0;top:0;bottom:0;width:2px;background:#D4DEF3\"><\u002Fdiv>\n      <div style=\"position:absolute;left:0;top:0;width:2px;height:{{ spineProgress }}%;background:linear-gradient(180deg,#5B8DEF,#0C2E6E);transition:height .1s linear\"><\u002Fdiv>\n      <sc-for list=\"{{ spineLevels }}\" as=\"lv\" hint-placeholder-count=\"6\">\n        <div style=\"position:relative;display:grid;grid-template-columns:52px 1fr auto;gap:24px;align-items:center;padding:19px 0 19px 0;margin-left:-26px;padding-left:26px\">\n          <div style=\"position:relative;z-index:2;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:16px;color:#fff;box-shadow:{{ lv.markShadow }};background:{{ lv.markBg }};transition:background .5s cubic-bezier(.22,.61,.36,1),box-shadow .5s;transform:{{ lv.markScale }}\">{{ lv.n }}<\u002Fdiv>\n          <div><h3 style=\"font-size:18px;font-weight:700;margin:0 0 3px;letter-spacing:-.02em;font-family:'Manrope',sans-serif\">{{ lv.title }}<\u002Fh3><p style=\"color:#586A87;font-size:14px;margin:0\">{{ lv.desc }}<\u002Fp><\u002Fdiv>\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:{{ lv.tagColor }};white-space:nowrap;display:{{ lvlTagDisplay }}\">{{ lv.tag }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:{{ secPad }};background:#F5F8FD\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:0 {{ wrapPad }}\">\n    <div data-rid=\"legalHead\" style=\"{{ legalHeadStyle }};max-width:62ch\">\n      <span style=\"font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#12388A\">Por qué funciona<\u002Fspan>\n      <h2 style=\"font-family:'Manrope',sans-serif;font-size:clamp(30px,4.2vw,46px);line-height:1.05;margin:16px 0 0;font-weight:800;letter-spacing:-.04em\">La persuasión resuelve. La ley respalda.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"margin-top:46px;display:grid;grid-template-columns:{{ legalCols }};gap:28px;align-items:stretch\">\n      <div data-rid=\"q\" style=\"{{ qStyle }};background:#E9F0FF;border-radius:16px;padding:34px;font-family:'Manrope',sans-serif;font-size:21px;line-height:1.42;color:#0A1830;font-weight:600;letter-spacing:-.02em\">\"La mayoría de los inquilinos se ponen al día cuando el cobro es <span style=\"color:#12388A\">profesional, constante y firme<\u002Fspan> — no cuando reciben una demanda.\"<\u002Fdiv>\n      <p data-rid=\"p\" style=\"{{ pStyle }};font-size:16px;color:#586A87;padding:6px 0\">Nuestra experiencia es persuadir al inquilino a pagar sin romper la relación. El respaldo legal —abogados y el marco de la Ley 85-25— está detrás como último recurso para el caso que no cede, y se activa solo con su consentimiento.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"precios\" style=\"padding:{{ secPad }};background:#F5F8FD\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:0 {{ wrapPad }}\">\n    <div data-rid=\"pricingHead\" style=\"{{ pricingHeadStyle }};max-width:62ch\">\n      <span style=\"font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#12388A\">Paquetes de gestión<\u002Fspan>\n      <h2 style=\"font-family:'Manrope',sans-serif;font-size:clamp(30px,4.2vw,46px);line-height:1.05;margin:16px 0 0;font-weight:800;letter-spacing:-.04em\">Precios por puerta.<\u002Fh2>\n      <p style=\"font-size:17px;color:#586A87;margin:18px 0 0\">Prepago, con un mínimo de tres meses. Mientras más largo el plan, menor el costo por mes.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:{{ priceCols }};gap:20px;margin-top:52px\">\n      <sc-for list=\"{{ plans }}\" as=\"pl\" hint-placeholder-count=\"3\">\n        <div style=\"background:#FFFFFF;border:{{ pl.border }};border-radius:18px;padding:30px 28px;display:flex;flex-direction:column;position:relative;box-shadow:{{ pl.shadow }};transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s\" style-hover=\"{transform:'translateY(-5px)'}\">\n          <sc-if value=\"{{ pl.badge }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:absolute;top:-11px;left:28px;background:#2563EB;color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:100px\">{{ pl.badge }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:18px;color:#0A1830\">{{ pl.name }}<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:700;color:#16A46B;margin-top:4px;min-height:16px\">{{ pl.save }}<\u002Fdiv>\n          <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:38px;letter-spacing:-.03em;color:#0A1830;margin:14px 0 2px\">{{ pl.total }} <span style=\"font-size:15px;color:#586A87;font-weight:500;font-family:'Inter',sans-serif\">/ puerta<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#586A87\">{{ pl.permes }}<\u002Fdiv>\n          <ul style=\"list-style:none;margin:20px 0 24px;padding:20px 0 0;border-top:1px solid #E1E9F5;display:grid;gap:11px\">\n            <sc-for list=\"{{ pl.features }}\" as=\"ft\" hint-placeholder-count=\"3\">\n              <li style=\"display:flex;gap:10px;font-size:14px;color:#243A5E;align-items:flex-start\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"flex:0 0 auto;color:#2563EB;margin-top:1px\"><path d=\"M5 12l5 5 9-11\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>{{ ft }}<\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n          <a href=\"{{ pl.payHref }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"margin-top:auto;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:#2563EB;color:#fff;border-radius:11px;padding:13px;font-weight:700;font-size:14.5px;text-decoration:none;transition:background .25s,transform .25s cubic-bezier(.34,1 1180px;margin:0 auto;padding:0 {{ wrapPad }}\">\n    <div data-rid=\"regHead\" style=\"{{ regHeadStyle }};max-width:62ch\">\n      <span style=\"font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#12388A\">Registro<\u002Fspan>\n      <h2 style=\"font-family:'Manrope',sans-serif;font-size:clamp(30px,4.2vw,46px);line-height:1.05;margin:16px 0 0;font-weight:800;letter-spacing:-.04em\">Registre su propiedad.<\u002Fh2>\n      <p style=\"font-size:17px;color:#586A87;margin:18px 0 0\">Complete el formulario y nos comunicaremos con usted para confirmar el plan y activar la gestión. El cobro inicia con su primer ciclo de renta.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:{{ formCols }};gap:52px;margin-top:50px;align-items:start\">\n      <div data-rid=\"fcard\" style=\"{{ fcardStyle }};background:#F5F8FD;border:1px solid #E1E9F5;border-radius:20px;padding:32px\">\n        <div style=\"margin-bottom:18px\">\n          <span style=\"display:block;font-size:13px;font-weight:600;color:#243A5E;margin:0 0 7px\">Nombre completo <span style=\"color:#2563EB\">*<\u002Fspan><\u002Fspan>\n          <input value=\"{{ form.nombre }}\" sc-camel-on-change=\"{{ onField('nombre') }}\" maxlength=\"80\" autocomplete=\"name\" placeholder=\"Ej. Juan Pérez\" style=\"{{ inputStyle('nombre') }}\" style-focus=\"{{ inputFocusStyle }}\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:18px\">\n          <span style=\"display:block;font-size:13px;font-weight:600;color:#243A5E;margin:0 0 7px\">WhatsApp <span style=\"color:#2563EB\">*<\u002Fspan><\u002Fspan>\n          <input value=\"{{ form.wa }}\" sc-camel-on-change=\"{{ onField('wa') }}\" inputmode=\"tel\" maxlength=\"20\" autocomplete=\"tel\" placeholder=\"+1 809 000 0000\" style=\"{{ inputStyle('wa') }}\" style-focus=\"{{ inputFocusStyle }}\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:18px\">\n          <span style=\"display:block;font-size:13px;font-weight:600;color:#243A5E;margin:0 0 7px\">Cantidad de propiedades <span style=\"color:#2563EB\">*<\u002Fspan><\u002Fspan>\n          <input value=\"{{ form.props }}\" sc-camel-on-change=\"{{ onField('props') }}\" inputmode=\"numeric\" maxlength=\"4\" placeholder=\"Ej. 2\" style=\"{{ inputStyle('props') }}\" style-focus=\"{{ inputFocusStyle }}\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:18px\">\n          <span style=\"display:block;font-size:13px;font-weight:600;color:#243A5E;margin:0 0 7px\">¿Tiene algún inquilino atrasado actualmente? <span style=\"font-weight:400;color:#586A87;font-size:12px\">(opcional)<\u002Fspan><\u002Fspan>\n          <div style=\"display:flex;gap:8px\">\n            <sc-for list=\"{{ atrasoOptions }}\" as=\"op\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ selectAtraso(op) }}\" style=\"flex:1;text-align:center;border-radius:11px;padding:11px 6px;cursor:pointer;font-size:13px;font-weight:600;transition:.2s;border:{{ atrasoBorder(op) }};color:{{ atrasoColor(op) }};background:{{ atrasoBg(op) }}\">{{ op }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-bottom:18px\">\n          <span style=\"display:block;font-size:13px;font-weight:600;color:#243A5E;margin:0 0 7px\">Plan de interés <span style=\"font-weight:400;color:#586A87;font-size:12px\">(opcional)<\u002Fspan><\u002Fspan>\n          <sc-raw-select value=\"{{ form.plan }}\" sc-camel-on-change=\"{{ onPlanField }}\" style=\"width:100%;font-family:inherit;font-size:15px;color:#0A1830;background:#FFFFFF;border:1.5px solid #E1E9F5;border-radius:11px;padding:12px 14px\">\n            <option value=\"\" disabled=\"true\">Seleccione<\u002Foption>\n            <option>3 meses — RD$1,497 por puerta<\u002Foption>\n            <option>6 meses — RD$2,545 por puerta<\u002Foption>\n            <option>1 año — RD$4,790 por puerta<\u002Foption>\n            <option>Aún no lo sé<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div style=\"margin-bottom:18px\">\n          <label style=\"display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#586A87;cursor:pointer\">\n            <input type=\"checkbox\" checked=\"{{ form.consent }}\" sc-camel-on-change=\"{{ onConsent }}\" style=\"width:18px;height:18px;margin-top:1px;accent-color:#2563EB;flex:0 0 auto\">\n            <span>Autorizo el tratamiento de mis datos conforme a la Política de Privacidad (Ley 172-13).<\u002Fspan>\n          <\u002Flabel>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ sendRegistration }}\" style=\"width:100%;margin-top:6px;background:#2563EB;color:#fff;border:0;border-radius:12px;padding:15px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 14px 30px rgba(37,99,235,.28);transition:transform .26s cubic-bezier(.34,1.56,.64,1),box-shadow .26s,background .26s\" style-hover=\"{transform:'translateY(-1px)',background:'#12388A',boxShadow:'0 20px 40px rgba(37,99,235,.36)'}\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2Zm5.8 14.03c-.24.68-1.42 1.31-1.95 1.36-.5.05-1.13.24-3.66-.77-3.08-1.24-5.04-4.4-5.19-4.6-.15-.2-1.24-1.65-1.24-3.15s.79-2.24 1.07-2.54c.28-.31.6-.38.8-.38.2 0 .4 0 .58.01.19.01.44-.07.68.52.24.59.83 2.04.9 2.19.07.15.12.32.02.52-.1.2-.15.32-.3.5-.15.17-.31.39-.44.52-.15.15-.3.31-.13.6.17.3.76 1.25 1.63 2.02 1.12 1 2.06 1.31 2.35 1.46.29.15.46.12.63-.07.17-.2.73-.85.93-1.14.2-.29.39-.24.66-.15.27.1 1.72.81 2.01.96.29.15.49.22.56.34.07.13.07.73-.17 1.41Z\"><\u002Fpath><\u002Fsvg>\n          Enviar registro\n        <\u002Fbutton>\n        <p style=\"font-size:12px;color:#586A87;margin-top:13px;text-align:center\">Sin compromiso hasta confirmar su plan. Precio de lanzamiento por tiempo limitado.<\u002Fp>\n      <\u002Fdiv>\n      <div data-rid=\"aside\" style=\"{{ asideStyle }}\">\n        <h3 style=\"font-family:'Manrope',sans-serif;font-size:20px;font-weight:700;margin:0 0 20px;letter-spacing:-.02em\">Cómo procedemos<\u002Fh3>\n        <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;gap:15px;margin-bottom:20px\">\n            <span style=\"flex:0 0 auto;width:34px;height:34px;border-radius:11px;background:#E9F0FF;color:#12388A;display:grid;place-items:center;font-family:'Manrope',sans-serif;font-weight:700;font-size:14px\">{{ st.n }}<\u002Fspan>\n            <div><div style=\"font-size:14.5px;font-weight:600;color:#0A1830\">{{ st.t }}<\u002Fdiv><div style=\"font-size:13px;color:#586A87\">{{ st.d }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"position:relative;overflow:hidden;background:#0A1830;color:#96A5C4;padding:70px 0 30px\">\n  <canvas ref=\"{{ footerCanvasRef }}\" style=\"position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.4\"><\u002Fcanvas>\n  <div style=\"max-width:1180px;margin:0 auto;padding:0 {{ wrapPad }};position:relative;z-index:2\">\n    <div style=\"display:grid;grid-template-columns:{{ footCols }};gap:36px\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:10px\">\n          <span style=\"font-family:'Provicali','Baloo 2',sans-serif;font-weight:800;font-size:22px;color:#fff;letter-spacing:-.02em\">StandardCheck<\u002Fspan>\n          <svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\" style=\"flex:0 0 auto;margin-top:2px\"><path d=\"M2.5 12.8l6 6L21.5 5.2\" stroke=\"#5B8DEF\" stroke-width=\"4.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n
